services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: landing_page_web
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      # Kita 'override' DATABASE_URL khusus saat web app berjalan di dalam Docker.
      # Di dalam jaringan Docker, host-nya bernama 'db' dan port internal MySQL adalah 3306.
      - DATABASE_URL=mysql://admin_user:@synergix48@db:3306/landing_page_db
    depends_on:
      - db
    volumes:
      - ./public:/app/public
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: landing_page_db
    restart: unless-stopped
    ports:
      - "4006:3306"
    environment:
      # Nilai ini diambil otomatis dari file .env oleh Docker Compose
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: landing_page_pma
    restart: unless-stopped
    ports:
      - "4007:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
